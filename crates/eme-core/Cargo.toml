[package]
name = "eme-core"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Everwood ME (EME) core: engine-free tool registry, command bus, server-confirmed undo stack, stroke coalescing, transport trait and the `.mveme` service JSON"

[lints]
workspace = true

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# `bevy` derives `Resource` / `Message` on the shared host types (`host`); off by default, so the
# core stays engine-free and its tests build no engine.
bevy_ecs = { version = "0.18.1", default-features = false, features = ["std"], optional = true }

[features]
bevy = ["dep:bevy_ecs"]
